<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="epg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0078FF"/>
    </linearGradient>
  </defs>

  <!-- COLONNA 1 — passato (opacità bassa) -->
  <rect x="3"    y="4.5"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.28"/>
  <rect x="3"    y="9.8"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.28"/>
  <rect x="3"    y="15.1" width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.28"/>

  <!-- COLONNA 2 — adesso (opacità piena) -->
  <rect x="9.3"  y="4.5"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)"/>
  <rect x="9.3"  y="9.8"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)"/>
  <rect x="9.3"  y="15.1" width="5.4" height="4.4" rx="1.1" fill="url(#epg)"/>

  <!-- COLONNA 3 — futuro (opacità media) -->
  <rect x="15.6" y="4.5"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.55"/>
  <rect x="15.6" y="9.8"  width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.55"/>
  <rect x="15.6" y="15.1" width="5.4" height="4.4" rx="1.1" fill="url(#epg)" opacity="0.55"/>
</svg>