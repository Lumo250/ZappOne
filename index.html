<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#242424" id="metaThemeColor" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon1.png" />
  <title>ZappOne - by AG Design</title>

  <!-- Applica il tema prima del rendering per evitare flash -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <link rel="stylesheet" href="zappone.css" />

  <!-- ─────────────────────────────────────────────────────────────────
       SPLASH SCREEN — stili locali all'overlay di avvio.
       Usano i token brand di zappone.css (--brand-*) per coerenza.
       ───────────────────────────────────────────────────────────────── -->
  <style>
    /* ─────── Root dello Splash ─────── */
    #appSplash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #030305;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
                   'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  visibility 0.6s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #appSplash.splash-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ferma l'animazione della progress bar quando lo splash è nascosto:
       non consuma CPU in background. */
    #appSplash.splash-hide .splash-progress {
      animation-play-state: paused;
      -webkit-animation-play-state: paused;
    }

    /* ─────── Aurora ─────── */
    .splash-aurora {
      position: absolute;
      inset: -50%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    .blob-blue {
      width: 90vmax;
      height: 90vmax;
      top: 10%;
      left: 10%;
      background: radial-gradient(circle at center,
                  color-mix(in srgb, var(--brand-blue) 45%, transparent) 0%,
                  transparent 65%);
      animation: driftBlue 12s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .blob-purple {
      width: 100vmax;
      height: 100vmax;
      bottom: 0;
      right: 5%;
      background: radial-gradient(circle at center,
                  color-mix(in srgb, var(--brand-violet) 40%, transparent) 0%,
                  transparent 65%);
      animation: driftPurple 16s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .blob-cyan {
      width: 70vmax;
      height: 70vmax;
      top: 30%;
      right: 20%;
      background: radial-gradient(circle at center,
                  color-mix(in srgb, var(--brand-cyan) 25%, transparent) 0%,
                  transparent 60%);
      animation: driftCyan 14s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    /* ─────── Layout UI ─────── */
    .splash-ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      padding: 0 24px;
      box-sizing: border-box;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .splash-brand {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      padding-left: 0.15em;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-views-wrapper {
      position: relative;
      width: 100%;
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }

    /* ─────── Fase 1: caricamento ─────── */
    .splash-core {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
    }

    .splash-track {
      width: min(260px, 70vw);
      height: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 2px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }

    .splash-progress {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg,
                  var(--brand-blue),
                  var(--brand-violet),
                  #ffffff);
      transform-origin: left center;
      -webkit-transform-origin: left center;
      will-change: transform;
      animation: progressFill 2s linear infinite;
      -webkit-animation: progressFill 2s linear infinite;
    }

    /* ─────── Fase 2: licenza ─────── */
    .splash-license {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      width: 100%;
      opacity: 0;
      transform: translate3d(0, 14px, 0);
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s,
                  visibility 0.5s 0.1s;
    }

    .splash-license-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.15);
    }
    .splash-license-sub {
      font-size: 0.82rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.58);
      margin-top: -4px;
    }
    .splash-license-sub b {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
    }

    .splash-license-input-wrap {
      width: 100%;
      margin-top: 6px;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg,
                  color-mix(in srgb, var(--brand-blue) 55%, transparent),
                  color-mix(in srgb, var(--brand-violet) 55%, transparent));
      transition: background 0.35s ease, box-shadow 0.35s ease;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--brand-blue) 10%, transparent);
    }
    .splash-license-input-wrap:focus-within {
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-violet));
      box-shadow:
        0 10px 30px color-mix(in srgb, var(--brand-blue) 35%, transparent),
        0 0 0 4px color-mix(in srgb, var(--brand-blue) 10%, transparent);
    }
    #splashLicenseInput {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 15px;
      background: rgba(8, 8, 14, 0.85);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
    }
    #splashLicenseInput::placeholder {
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.14em;
    }

    .splash-license-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 6px;
    }
    .splash-btn {
      padding: 13px 18px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease,
                  background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .splash-btn:active { transform: scale(0.98); }

    .splash-btn-primary {
      background: linear-gradient(90deg, var(--brand-blue), var(--brand-violet));
      color: #fff;
      box-shadow: 0 8px 26px color-mix(in srgb, var(--brand-blue) 35%, transparent);
    }
    .splash-btn-primary:hover {
      box-shadow: 0 10px 34px color-mix(in srgb, var(--brand-blue) 55%, transparent);
    }
    .splash-btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .splash-btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .splash-btn-ghost:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.09);
    }
    .splash-btn-ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ─────── Transizione fase 1 → fase 2 ─────── */
    #appSplash.splash-phase-license .splash-core {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
      pointer-events: none;
      visibility: hidden;
    }
    #appSplash.splash-phase-license .splash-license {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      pointer-events: auto;
      visibility: visible;
    }
    #appSplash.splash-phase-license .splash-brand {
      transform: translate3d(0, -15px, 0);
    }

    /* ─────── Keyframes ─────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes progressFill {
      0%   { transform: scale3d(0.02, 1, 1); -webkit-transform: scale3d(0.02, 1, 1); }
      100% { transform: scale3d(1, 1, 1);    -webkit-transform: scale3d(1, 1, 1); }
    }
    @keyframes driftBlue {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(15%, 10%, 0) scale(1.1); }
    }
    @keyframes driftPurple {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-10%, -15%, 0) scale(1.15); }
    }
    @keyframes driftCyan {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-15%, 20%, 0) scale(1.05); }
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════════════
       SPLASH SCREEN (Fase 1: caricamento / Fase 2: licenza)
       role=dialog + aria-modal: quando visibile è un dialog a schermo
       intero che cattura il focus. JS rimuove role/aria quando la splash
       viene nascosta (o aggiunge aria-hidden="true").
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="appSplash" role="dialog" aria-modal="true" aria-label="ZappOne">

    <!-- Sfondo Aurora -->
    <div class="splash-aurora" aria-hidden="true">
      <div class="aurora-blob blob-blue"></div>
      <div class="aurora-blob blob-purple"></div>
      <div class="aurora-blob blob-cyan"></div>
    </div>

    <!-- Contenitore UI -->
    <div class="splash-ui">

      <!-- Brand -->
      <div class="splash-brand">ZappOne</div>

      <!-- Wrapper per scambiare Fase 1 e Fase 2 -->
      <div class="splash-views-wrapper">

        <!-- FASE 1: Caricamento -->
        <div class="splash-core">
          <div class="splash-track" role="progressbar" aria-label="Caricamento in corso">
            <div class="splash-progress"></div>
          </div>
          <div class="splash-note">loading...</div>
        </div>

        <!-- FASE 2: Inserimento Licenza -->
        <div class="splash-license">
          <div class="splash-license-heading">Licenza ZappOne</div>
          <div class="splash-license-sub">
            Inserisci la tua chiave o procedi in <b>Demo</b>
          </div>

          <div class="splash-license-input-wrap">
            <input
              type="text"
              id="splashLicenseInput"
              placeholder="XXXX-XXXX-XXXX"
              aria-label="Chiave di licenza"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false" />
          </div>

          <div class="splash-license-actions">
            <button type="button" class="splash-btn splash-btn-primary">Verifica Licenza</button>
            <button type="button" class="splash-btn splash-btn-ghost">Continua in Demo</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════
       HOOKS JS NASCOSTI
       Div vuoti usati dal JavaScript come punti di aggancio per
       aprire sidebar ed esportazione. Non rimuovere senza aggiornare JS.
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="optionsBtn" class="hidden"></div>
  <div id="exportButton" class="hidden"></div>

  <!-- ═══════════════════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════════════════ -->
  <header class="main-header">

    <!-- Pill Opzioni / Back -->
    <button id="optionsExportPill" class="pill-button" type="button"
            title="Opzioni / Torna indietro"
            aria-label="Opzioni">
      <svg class="icon-options" width="20" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <svg class="icon-back" width="20" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- Ricerca globale -->
    <div id="headerSearchContainer" class="header-search">
      <div class="input-container header-input">
        <input type="text" id="searchInput" class="text-input"
               placeholder="Cerca..." aria-label="Cerca" />

        <!-- Toggle filtro contestuale (EPG ↔ canale) -->
        <button type="button" id="searchFilterToggle" class="search-filter-toggle"
                data-filter-context="epg"
                aria-label="Filtro EPG"
                title="Mostra solo canali con EPG">
          <svg class="filter-icon filter-icon-epg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M7 3v4M17 3v4M3 10h18"/>
          </svg>
          <svg class="filter-icon filter-icon-channel" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="7" width="20" height="13" rx="2"/>
            <polyline points="17 2 12 7 7 2"/>
          </svg>
        </button>

        <!-- X di cancellazione -->
        <button type="button" class="clear-input" aria-label="Cancella ricerca">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Gruppo pill: vista + preferiti.
         Nota: la classe del contenitore è .header-pill-group (ex
         .elegant-toggle-container, nome fuorviante perché qui non ci sono
         toggle). Aggiornare eventuali query JS che cercavano la vecchia classe. -->
    <div class="header-pill-group">

      <!-- Toggle vista (lista / griglia / collapse) -->
      <button id="viewModePill" class="pill-button list-mode" type="button"
              title="Cambia visualizzazione"
              aria-label="Cambia visualizzazione">
        <svg class="icon-list" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <circle cx="4" cy="6" r="1"></circle>
          <circle cx="4" cy="12" r="1"></circle>
          <circle cx="4" cy="18" r="1"></circle>
        </svg>
        <svg class="icon-grid" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <svg class="icon-expand" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 15 12 9 18 15"></polyline>
        </svg>
      </button>

      <!-- Toggle preferiti / tutti (long-press: modalità cancellazione) -->
      <button id="favoritesPill" class="pill-button" type="button"
              title="Tutti / Preferiti (clic) — Long click: cancellazione"
              aria-label="Filtro preferiti">
        <svg class="icon-tutti" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25 L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <svg class="icon-preferiti" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25 L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <svg class="icon-trash" width="20" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14 a2 2 0 0 0 2 2h14 a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3 L12 15l-4 1 1-4 9.5-9.5z"></path>
          <circle cx="19" cy="5" r="3" fill="#ff4444" stroke="none"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- Controlli file input (nascosti) -->
  <div id="controls">
    <input type="file" id="fileInput" accept=".m3u,.m3u8" hidden />
    <input type="file" id="epgFileInput" accept=".xml,.json,.xml.gz" hidden />
  </div>

  <!-- Contenitore principale: lista canali -->
  <div id="channelListContainer" class="view-container">
    <div id="channelList" data-context="channels"></div>
  </div>

  <!-- Playlist manager -->
  <div id="playlistListContainer" class="view-container hidden">
    <div id="playlistList" data-context="playlists"></div>
  </div>

  <!-- EPG manager -->
  <div id="epgListContainer" class="view-container hidden">
    <div id="epgList" data-context="epg"></div>
  </div>

  <!-- Full EPG (timeline/griglia) -->
  <div id="fullEpgContainer" class="hidden">

    <div class="group-header" id="fullEpgHeader" data-mode="list">
      <div class="group-title">
        <span id="fullEpgTitle">Guida canali</span>
      </div>
      <span class="full-epg-mode-indicator" aria-hidden="true"></span>
    </div>

    <div id="fullEpgList" class="group-content list-view"></div>
    <div id="fullEpgGrid" class="full-epg-grid hidden"></div>
  </div>

  <!-- Drawer EPG laterale -->
  <div id="channelEpgDrawer" class="epg-drawer hidden">

    <div class="drawer-header">
      <div class="drawer-header-text">
        <div id="drawerChannelTitle" class="drawer-channel-title"></div>
        <div class="drawer-channel-subtitle">Guida programmi</div>
      </div>
      <button id="drawerCloseBtn" class="drawer-close" type="button" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="drawerNowPlaying" class="drawer-now-playing hidden"></div>
    <div id="drawerPrograms" class="drawer-programs"></div>
  </div>

  <!-- Dettaglio EPG canale (alternativa embedded) -->
  <div id="channelEpgDetail" class="hidden">
    <div id="channelEpgPrograms"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════
       PLAYER VIDEO/AUDIO + METADATI
       (Spostato PRIMA della tab bar per un ordine DOM/tastiera corretto.)
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="playerContainer">
    <div id="currentChannelInfo">

  <!-- ═══════════════════════════════════════════════════════════════════
       BOTTOM SHEET — Carica M3U da URL
       Overlay CONDIVISO (#bottomSheetOverlay) fra questo e il bottom
       sheet EPG: il JS lo apre/chiude in base a quale sheet è attivo.
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="m3uUrlBottomSheet" class="bottom-sheet hidden" role="dialog"
       aria-modal="true" aria-labelledby="m3uSheetTitle">
    <div class="bottom-sheet-drag-area"></div>
    <div class="bottom-sheet-handle" aria-hidden="true"></div>

    <button type="button" class="bottom-sheet-close" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>

    <div class="bottom-sheet-header">
      <h3 id="m3uSheetTitle">Carica M3U da URL</h3>
      <p class="bottom-sheet-subtitle">Incolla un link o carica un file locale</p>
    </div>

    <div class="bottom-sheet-content">
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        </svg>
        <input type="text" id="modalM3UName" class="metadata-input"
               placeholder="Nome playlist (es. Lista1)" autocomplete="off"
               aria-label="Nome playlist" />
      </div>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input type="text" id="modalM3UUrl" class="metadata-input"
               placeholder="URL playlist (https://...)" autocomplete="off"
               inputmode="url" aria-label="URL playlist" />
        <div id="modalM3ULoading" class="input-spinner hidden" aria-hidden="true"></div>
      </div>
    </div>

    <div class="bottom-sheet-actions">
      <button id="m3uSaveBtn" type="button" class="sheet-btn-primary">
        Carica playlist
      </button>

      <div class="sheet-actions-secondary">
        <button id="m3uLocalBtn" type="button" class="sheet-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>Locale</span>
        </button>


        <button id="m3uCancelBtn" type="button" class="sheet-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
          <span>Annulla</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════
       BOTTOM SHEET — Carica EPG da URL
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="epgUrlBottomSheet" class="bottom-sheet hidden" role="dialog"
       aria-modal="true" aria-labelledby="epgSheetTitle">

        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>

    <div class="bottom-sheet-header">
      <h3 id="epgSheetTitle">Carica EPG da URL</h3>

      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"

        <input type="text" id="modalEPGName" class="metadata-input"

      </div>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>

        <input type="text" id="modalEPGUrl" class="metadata-input"

      </div>
    </div>

    <div class="bottom-sheet-actions">
      <button id="epgSaveBtn" type="button" class="sheet-btn-primary">
        Carica EPG
      </button>

      <div class="sheet-actions-secondary">
        <button id="epgLocalBtn" type="button" class="sheet-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>Locale</span>
        </button>


        <button id="epgCancelBtn" type="button" class="sheet-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
          <span>Annulla</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Overlay dedicato M3U -->
  <div id="bottomSheetOverlay" class="bottom-sheet-overlay hidden"
       aria-hidden="true"></div>

  <!-- Overlay dedicato EPG (il JS lo cerca per id in §51 e §59) -->
  <div id="bottomSheetOverlayEPG" class="bottom-sheet-overlay hidden"
       aria-hidden="true"></div>

  <!-- Trigger legacy: il JS fa .click() su questi due pulsanti da #m3uSaveBtn
       e #epgSaveBtn. Devono esistere nel DOM, restano nascosti. -->
  <button id="modalConfirm"    class="hidden" type="button">Carica</button>
  <button id="modalConfirmEPG" class="hidden" type="button">Carica</button>

  <!-- ═══════════════════════════════════════════════════════════════════
       OVERLAY MANUALE UTENTE
       ═══════════════════════════════════════════════════════════════════ -->
  <div id="manualOverlay" class="manual-overlay hidden" aria-hidden="true">
    <button id="closeManualBtn" class="manual-close" type="button"
            aria-label="Chiudi manuale">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <span>Torna all'app</span>
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════
       LIBRERIE ESTERNE
       hls.js 1.7.3 / dashjs 5.2.1: versioni fisse per evitare che una
       nuova major cambi il comportamento dell'app senza preavviso.
       ═══════════════════════════════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script>
    // dash.js solo su browser non-iOS/Safari (iOS ha supporto nativo HLS).
    if (!/iP(hone|od|ad).+Version\/\d+.+Safari/i.test(navigator.userAgent)) {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/dashjs@5.2.1/dist/modern/umd/dash.all.min.js';
      script.async = false;
      document.head.appendChild(script);
    }
  </script>
