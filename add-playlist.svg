<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPl5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="glossPl5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="badgePl5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="badgeGlossPl5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sfondo Squircle con gradiente -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgPl5)" />
  
  <!-- Effetto glossy superiore -->
  <path d="M 30 6 L 70 6 Q 94 6 94 30 L 94 38 Q 50 26 6 38 L 6 30 Q 6 6 30 6 Z" fill="url(#glossPl5)" />

  <!-- Bordo esterno luminoso -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Documento Playlist (più alto, senza header) -->
  <rect x="22" y="22" width="56" height="54" rx="6" fill="#F8FAFC" />

  <!-- Riga 1: Play + Traccia lunga -->
  <polygon points="28,33 28,41 36,37" fill="#06B6D4" />
  <line x1="41" y1="37" x2="72" y2="37" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Riga 2: Play + Traccia media -->
  <polygon points="28,47 28,55 36,51" fill="#06B6D4" />
  <line x1="41" y1="51" x2="67" y2="51" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Riga 3: Play + Traccia corta -->
  <polygon points="28,61 28,69 36,65" fill="#06B6D4" />
  <line x1="41" y1="65" x2="60" y2="65" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Badge "+" in basso a destra -->
  <circle cx="78" cy="78" r="19" fill="url(#badgePl5)" />
  <circle cx="78" cy="78" r="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
  <!-- Gloss sul badge -->
  <path d="M 63 72 Q 78 62 93 72 L 93 78 Q 78 68 63 78 Z" fill="url(#badgeGlossPl5)" />
  <!-- Segno + -->
  <line x1="78" y1="69" x2="78" y2="87" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <line x1="69" y1="78" x2="87" y2="78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
</svg>